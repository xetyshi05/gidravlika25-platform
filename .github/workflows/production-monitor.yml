name: Production monitor

# REL-03: uptime of every host, TLS expiry and GET /ops/status (database, S3,
# 5xx, latency, DaData budget, backup age, file cleanup). One issue per failed
# check, closed automatically when the check passes again. GitHub runs cron
# best-effort (and pauses it after 60 days without repository activity), so
# an external uptime service is configured as well; see deploy/README.md.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MONITOR_DOMAIN: ${{ vars.MONITOR_DOMAIN || 'gidravlika25.ru' }}
      RESULTS_FILE: monitor-results.json

    steps:
      - name: Check out the monitor script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: deploy/scripts/production-monitor.sh
          sparse-checkout-cone-mode: false

      - name: Run production checks
        id: checks
        continue-on-error: true
        env:
          OPS_STATUS_TOKEN: ${{ secrets.OPS_STATUS_TOKEN }}
        run: bash deploy/scripts/production-monitor.sh

      - name: Open and close alert issues
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const results = JSON.parse(fs.readFileSync(process.env.RESULTS_FILE, 'utf8'));
            const prefix = '[Production alert] ';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const byTitle = new Map(
              open.filter((issue) => !issue.pull_request).map((issue) => [issue.title, issue]),
            );
            for (const result of results) {
              const title = prefix + result.title;
              const issue = byTitle.get(title);
              if (!result.ok && !issue) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body: [
                    `Проверка \`${result.id}\` не прошла.`,
                    '',
                    result.details,
                    '',
                    `Workflow: ${run}`,
                    '',
                    'Порядок разбора — в deploy/README.md, раздел «Мониторинг и оповещения».',
                  ].join('\n'),
                });
              } else if (result.ok && issue) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `Проверка \`${result.id}\` снова проходит: ${result.details} Инцидент закрыт автоматически.`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                });
              }
            }

      - name: Fail when a check failed
        if: steps.checks.outcome == 'failure'
        run: exit 1
