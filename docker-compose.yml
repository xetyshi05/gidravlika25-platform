services:
  postgres:
    image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    container_name: gidravlika-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: gidravlika
      POSTGRES_USER: gidravlika
      POSTGRES_PASSWORD: gidravlika_dev_password

    # Development ports listen on the loopback interface only.
    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

  # Local S3 (MinIO stopped publishing images in 2025). S3Mock does not check
  # credentials, and objects are readable without them, like the public bucket.
  s3:
    image: adobe/s3mock:5.2.3@sha256:ab01a6946750f451ca215a47e91030695b260e4003b8a5a6201d25029b8fca92
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: gidravlika-catalog
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /home/cnb/s3mock
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "127.0.0.1:9000:9090"
    # The home directory of the image's user: a new volume keeps its owner.
    volumes:
      - s3_data:/home/cnb

  image-worker:
    build: ./services/image-worker
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 3m

volumes:
  postgres_data:
  s3_data:
