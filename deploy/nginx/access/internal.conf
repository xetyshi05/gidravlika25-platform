# Network access to CRM and Back Office (included by every CRM/BO location).
#
# Owner decision D4 (2026-09-23): CRM and Back Office stay reachable from the
# internet and rely on password + 2FA + per-account backoff. The public API
# host does not expose CRM/BO routes either way (SEC-02).
#
# To restrict by office or VPN address, replace "allow all;" with:
#   allow 203.0.113.10/32;
#   deny all;
#
# Emergency lockdown (suspected credential leak): replace "allow all;" with
# "deny all;" (optionally preceded by "allow <your IP>/32;"). See
# deploy/README.md, "Аварийное закрытие CRM и Back Office".
#
# The directory, not this file, is mounted into Nginx, so edits made by any
# editor are visible after "nginx -t && nginx -s reload".
allow all;
