map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

map $http_x_request_id $request_id_header {
    default $http_x_request_id;
    "" $request_id;
}

server_tokens off;

server {
    listen 80;
    listen [::]:80;
    server_name ${SITE_HOST} ${SITE_WWW_HOST} ${CRM_HOST} ${BACKOFFICE_HOST} ${API_HOST};

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 503 "TLS certificate bootstrap in progress.\n";
    }
}
