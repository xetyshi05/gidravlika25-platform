map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

map $http_x_request_id $request_id_header {
    default $http_x_request_id;
    "" $request_id;
}

limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;

# Methods allowed on the public API host (SEC-02). OPTIONS is CORS preflight.
map $request_method $public_api_read {
    GET 1;
    HEAD 1;
    OPTIONS 1;
    default 0;
}

map $request_method $public_api_write {
    POST 1;
    OPTIONS 1;
    default 0;
}

server_tokens off;

# Security headers for every response, including Nginx's own errors and
# redirects. Upstream copies are hidden so each header is sent exactly once.
# add_header is inherited only by blocks that declare none themselves: a
# server or location that needs its own add_header must repeat these.
proxy_hide_header X-Powered-By;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;

# Default upstream timeouts. They live here rather than in proxy-common.conf so
# that a location can override them without duplicating the directive.
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;

server {
    listen 80;
    listen [::]:80;
    server_name ${SITE_HOST} ${SITE_WWW_HOST} ${CRM_HOST} ${BACKOFFICE_HOST} ${API_HOST};

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${SITE_HOST} ${SITE_WWW_HOST};

    ssl_certificate /etc/letsencrypt/live/${TLS_CERT_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${TLS_CERT_NAME}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;

    if ($host = ${SITE_WWW_HOST}) {
        return 301 https://${SITE_HOST}$request_uri;
    }

    client_max_body_size 2m;
    location / {
        proxy_pass http://web:3000;
        include /etc/nginx/conf.d/proxy-common.conf;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${CRM_HOST};

    ssl_certificate /etc/letsencrypt/live/${TLS_CERT_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${TLS_CERT_NAME}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;
    location / {
        include /etc/nginx/access/internal.conf;
        proxy_pass http://crm:3000;
        include /etc/nginx/conf.d/proxy-common.conf;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${BACKOFFICE_HOST};

    ssl_certificate /etc/letsencrypt/live/${TLS_CERT_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${TLS_CERT_NAME}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 9m;
    location / {
        include /etc/nginx/access/internal.conf;
        proxy_pass http://backoffice:3000;
        include /etc/nginx/conf.d/proxy-common.conf;
    }

    # BFF proxy to the API. Media routes (background removal, originals sync)
    # wait up to 120 s in the BFF (apps/backoffice/src/lib/backoffice-proxy.ts),
    # so Nginx must wait longer to let the BFF report its own error.
    location /api/backoffice/ {
        include /etc/nginx/access/internal.conf;
        proxy_pass http://backoffice:3000;
        include /etc/nginx/conf.d/proxy-common.conf;
        proxy_send_timeout 125s;
        proxy_read_timeout 125s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${API_HOST};

    ssl_certificate /etc/letsencrypt/live/${TLS_CERT_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${TLS_CERT_NAME}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Public API perimeter (SEC-02). Only the routes used by the public site's
    # browser code and health checks are proxied; CRM and Back Office call
    # http://api:4000 inside the Docker network. Everything else, including
    # /metrics, /auth, /customers, /backoffice and CRM operations on
    # /requests, is a 404 here. Nginx matches the normalised, case-sensitive
    # path, so encoded dot segments and case variants fall through to the 404.
    client_max_body_size 128k;
    limit_req zone=api_general burst=40 nodelay;
    error_page 404 @api_not_found;

    location = /health {
        if ($public_api_read = 0) { return 404; }
        proxy_pass http://api:4000;
        include /etc/nginx/conf.d/proxy-common.conf;
    }

    location = /ready {
        if ($public_api_read = 0) { return 404; }
        proxy_pass http://api:4000;
        include /etc/nginx/conf.d/proxy-common.conf;
    }

    # Operations status for the external monitor (REL-03); the API requires the
    # OPS_STATUS_TOKEN bearer token and answers 404 when it is not configured.
    location = /ops/status {
        if ($public_api_read = 0) { return 404; }
        proxy_pass http://api:4000;
        include /etc/nginx/conf.d/proxy-common.conf;
    }

    # Without this, the prefix location below would redirect /catalog to /catalog/.
    location = /catalog {
        return 404;
    }

    location ^~ /catalog/ {
        if ($public_api_read = 0) { return 404; }
        proxy_pass http://api:4000;
        include /etc/nginx/conf.d/proxy-common.conf;
    }

    location = /site-media {
        if ($public_api_read = 0) { return 404; }
        proxy_pass http://api:4000;
        include /etc/nginx/conf.d/proxy-common.conf;
    }

    location = /address/suggestions {
        if ($public_api_read = 0) { return 404; }
        proxy_pass http://api:4000;
        include /etc/nginx/conf.d/proxy-common.conf;
    }

    # ALTCHA challenge for the public forms (SEC-03).
    location = /requests/challenge {
        if ($public_api_read = 0) { return 404; }
        proxy_pass http://api:4000;
        include /etc/nginx/conf.d/proxy-common.conf;
    }

    location ~ ^/requests/(cart|custom|wholesale)$ {
        if ($public_api_write = 0) { return 404; }
        proxy_pass http://api:4000;
        include /etc/nginx/conf.d/proxy-common.conf;
    }

    location / {
        return 404;
    }

    # Same shape as the API's own 404, so the response does not reveal
    # whether a route exists behind the proxy.
    location @api_not_found {
        default_type application/json;
        return 404 '{"statusCode":404,"message":"Not Found"}\n';
    }
}
